<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MESURIA - Créer un compte</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@800;900&display=swap"
    />
  </head>
  <body class="auth-page">
    <div class="container">
      <!-- En-tête -->
      <header class="header">
        <a href="Accueil.html" style="text-decoration: none"
          ><h1 class="logo">MESURIA</h1></a
        >
      </header>
      <p class="cta-text">
        Rejoignez nos clients satisfaits et découvrez la précision MESURIA.
      </p>
    </div>

    <div class="background-animation">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
      <div class="shape shape-4"></div>
    </div>
    <div class="container auth-container">
      <div class="auth-card">
        <h1>Créer un compte</h1>

        <form action="{{ url_for('register') }}" method="POST">
          <label for="name">Nom </label>
          <input type="text" id="name" name="name" required />

          <label for="username">Prénom</label>
          <input type="text" id="username" name="username" required />

          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" name="email" required />

          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" required />

          <label for="password2">Confirmer le mot de passe</label>
          <input type="password" id="password2" name="password2" required />

          <button type="submit" class="btn-primary">Créer mon compte</button>
        </form>

        <p class="auth-link">
          Déjà un compte ?
          <a href="{{ url_for('login') }}">Se connecter</a>
        </p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
