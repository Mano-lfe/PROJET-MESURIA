<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MESURIA - Mesures Précises</title>

    <!-- CSS principal -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />

    <!-- Icônes et polices -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@800;900&display=swap"
    />
  </head>

  <body>
    <!-- Fond animé (optionnel, tu peux supprimer si tu veux encore plus simple) -->
    <div class="background-animation">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
      <div class="shape shape-4"></div>
    </div>

    <div class="container">
      <!-- En-tête -->
      <header class="header">
        <a href="Accueil.html" style="text-decoration: none"
          ><h1 class="logo">MESURIA</h1></a
        >
      </header>

      <!-- Contenu principal -->
      <main class="main-content">
        <section class="hero">
          <h2 class="hero-title">Bienvenue chez MESURIA !</h2>
          <p class="hero-subtitle">
            L'excellence dans la prise de mesures précises.
          </p>
        </section>

        <section class="cta-section">
          <h2 class="cta-title">Prêt à obtenir vos mesures précises ?</h2>
          <p class="cta-text">
            Rejoignez nos clients satisfaits et découvrez la précision MESURIA.
          </p>

          <div class="cta-buttons">
            <a href="{{ url_for('login') }}" class="btn-primary"
              >Se connecter
            </a>
            <a href="{{ url_for('register') }}" class="btn-secondary">
              Créer un compte
            </a>
            
          </div>
        </section>
      </main>

      <!-- Pied de page -->
      <footer class="footer">
        <div class="footer-content">
          <div class="footer-logo">MESURIA</div>
          <div class="footer-info">
            <p><i class="fas fa-map-marker-alt"></i> Paris, France</p>
            <p><i class="fas fa-phone"></i> +33 1 23 45 67 89</p>
            <p><i class="fas fa-envelope"></i> contact@mesuria.fr</p>
          </div>
          <div class="footer-social">
            <a href=""><i class="fab fa-twitter"></i></a>
            <a href="https://www.linkedin.com/in/junior-feha-320875366/"
              ><i class="fab fa-linkedin"></i
            ></a>
            <a
              href="https://www.instagram.com/_mano_fh?igsh=OWhtdmFidDBiZTRp&utm_source=qr"
              ><i class="fab fa-instagram"></i
            ></a>
          </div>
        </div>
        <div class="footer-bottom">
          <p>&copy; 2026 MESURIA</p>
        </div>
      </footer>
    </div>
  </body>
</html>
